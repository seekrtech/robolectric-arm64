name: publish

on:
  workflow_dispatch:
    inputs:
      robolectric_version:
        description: Robolectric version to publish (e.g. 4.16.1)
        required: true
        type: string

permissions:
  contents: write # commit registry updates
  packages: write # publish artifacts to GitHub Packages
  issues: write # auto-issue on failure

concurrency:
  group: publish-${{ inputs.robolectric_version }}
  # A queued duplicate is a no-op via the registry early-exit guard; never cancel an in-flight publish.

jobs:
  publish:
    runs-on: [self-hosted, jose, linux, arm64]
    env:
      VERSION: ${{ inputs.robolectric_version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Run publish pipeline
        id: pipeline
        run: ./scripts/publish-pipeline.sh "$VERSION"

      - name: Commit registry
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published-versions.json
          git diff --cached --quiet || { git commit -m "registry: mark $VERSION published"; git push; }

      - name: Record blocked and open issue
        if: failure() && steps.pipeline.outcome == 'failure'
        run: |
          CP="$(./scripts/classpath.sh)"
          if java -cp "$CP" com.seekrtech.tools.registry.Registry published-versions.json is-blocked "$VERSION"; then
            echo "already blocked: $VERSION"
            exit 0
          fi
          java -cp "$CP" com.seekrtech.tools.registry.Registry published-versions.json record-blocked "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published-versions.json
          git diff --cached --quiet || { git commit -m "registry: block $VERSION"; git push; }
          gh issue create \
            --title "publish failed for robolectric $VERSION" \
            --body "The publish pipeline failed for robolectric $VERSION. See run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. The version is recorded as blocked and will not be retried automatically."
